version: 2
updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "依赖"
    labels:
      - "internal"
      - "dependencies"
      - "github_actions"
    groups:
      github-actions:
        patterns:
          - "*"
  # Python 依赖
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "依赖"
    labels: [dependencies, internal]
    groups:
      python-packages:
        patterns:
          - "*"
  # 前端依赖
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "依赖"
    labels: [dependencies, internal]
    ignore:
      - dependency-name: "@hey-api/openapi-ts"
    groups:
      npm-packages:
        patterns:
          - "*"
  # Docker 镜像
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "依赖"
    groups:
      docker:
        patterns:
          - "*"
  # Docker Compose 镜像
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "依赖"
    groups:
      docker-compose:
        patterns:
          - "*"
