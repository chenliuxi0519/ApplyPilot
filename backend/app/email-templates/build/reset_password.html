<!doctype html>
<html lang="zh-CN">
  <body style="margin:0;background:#fafbfc;font-family:Arial,'Microsoft YaHei',sans-serif;color:#333">
    <main style="max-width:560px;margin:32px auto;padding:40px 24px;background:#fff;text-align:center">
      <h1 style="font-size:22px">{{ project_name }} - 重置密码</h1>
      <p>你好，{{ username }}</p>
      <p>我们收到了你的密码重置请求，请点击下方按钮继续：</p>
      <p><a href="{{ link }}" style="display:inline-block;padding:12px 24px;border-radius:8px;background:#009688;color:#fff;text-decoration:none">重置密码</a></p>
      <p>如果按钮无法打开，请复制以下链接到浏览器：</p>
      <p><a href="{{ link }}">{{ link }}</a></p>
      <p>此链接将在 {{ valid_hours }} 小时后失效。</p>
      <hr style="border:0;border-top:1px solid #ddd">
      <p style="font-size:14px;color:#666">如果不是你本人发起的请求，请忽略这封邮件。</p>
    </main>
  </body>
</html>
